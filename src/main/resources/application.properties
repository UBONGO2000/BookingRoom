spring.application.name=${APP_NAME:BookingRoom}
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookingroom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driverClassName=org.postgresql.Driver

# Defaults below are dev-friendly (auto-create/update schema, log SQL).
# In production, activate the "prod" profile (SPRING_PROFILES_ACTIVE=prod) which
# switches ddl-auto to "validate" and disables SQL logging - see application-prod.properties.
# ddl-auto=validate requires the schema to already exist (run once with "update", or
# introduce a migration tool such as Flyway, before switching a real deployment over).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true


spring.datasource.hikari.maximum-pool-size=5
#spring.mvc.throw-exception-if-no-handler-found=true
#spring.web.resources.add-mappings=false

app.seed.default-users.enabled=${SEED_DEFAULT_USERS:true}
app.seed.default-users.admin-username=${SEED_ADMIN_USERNAME:admin}
app.seed.default-users.admin-email=${SEED_ADMIN_EMAIL:admin@gmail.com}
app.seed.default-users.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.default-users.user-username=${SEED_USER_USERNAME:user}
app.seed.default-users.user-email=${SEED_USER_EMAIL:user@gmail.com}
app.seed.default-users.user-password=${SEED_USER_PASSWORD:User@123}

app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login.lock-duration-minutes=${LOGIN_LOCK_DURATION_MINUTES:15}
