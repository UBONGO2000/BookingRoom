spring.application.name=${APP_NAME:BookingRoom}
server.port=${PORT:8080}

# Actuator : seul /actuator/health est expose (sonde Docker/compose).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Charge un eventuel fichier .env local (non versionne, format cle=valeur).
# Spring Boot ne lit pas .env nativement : sans cette ligne, le fichier serait ignore.
# Les variables d'environnement du systeme restent prioritaires.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookingroom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schema est versionne par Flyway (src/main/resources/db/migration).
# ddl-auto=validate : Hibernate verifie le schema sans jamais le modifier.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Migrations communes + variante du moteur ({vendor} = postgresql ou h2).
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
# Bases existantes creees avant Flyway : baseline en V1, puis V2+ sont appliquees.
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true

# Pas de session ouverte pendant le rendu des vues : les associations necessaires
# sont chargees explicitement (@EntityGraph dans BookingRepository).
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=5
#spring.web.resources.add-mappings=false

app.seed.default-users.enabled=${SEED_DEFAULT_USERS:true}
app.seed.default-users.admin-username=${SEED_ADMIN_USERNAME:admin}
app.seed.default-users.admin-email=${SEED_ADMIN_EMAIL:admin@gmail.com}
app.seed.default-users.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.default-users.user-username=${SEED_USER_USERNAME:user}
app.seed.default-users.user-email=${SEED_USER_EMAIL:user@gmail.com}
app.seed.default-users.user-password=${SEED_USER_PASSWORD:User@123}

app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login.lock-duration-minutes=${LOGIN_LOCK_DURATION_MINUTES:15}
