spring.application.name=${APP_NAME:BookingRoom}
server.port=${PORT:8080}

# Actuator : health pour les sondes, info pour verifier le commit deploye (CD).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
# Renseigne automatiquement par Render au moment du deploiement.
info.app.commit=${RENDER_GIT_COMMIT:unknown}

# OpenAPI : JSON desactive par defaut, active uniquement par le profil dev.
# Pas de Swagger UI : la CSP stricte du projet interdit les styles inline
# dont Swagger UI a besoin. Le JSON reste exploitable par curl/Postman/Insomnia.
springdoc.api-docs.enabled=false
springdoc.api-docs.path=/v3/api-docs
# Ne documente que l'API REST, pas les controleurs Thymeleaf.
springdoc.paths-to-match=/api/**

# CORS : vide par defaut (meme origine uniquement). En dev, renseigner des
# origines explicites dans CORS_ALLOWED_ORIGINS, separees par des virgules.
# Le jeton CSRF et les cookies de session imposent allowCredentials=true,
# donc "*" est volontairement refuse au demarrage.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Charge un eventuel fichier .env local (non versionne, format cle=valeur).
# Spring Boot ne lit pas .env nativement : sans cette ligne, le fichier serait ignore.
# Les variables d'environnement du systeme restent prioritaires.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookingroom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schema est versionne par Flyway (src/main/resources/db/migration).
# ddl-auto=validate : Hibernate verifie le schema sans jamais le modifier.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Migrations communes + variante du moteur ({vendor} = postgresql ou h2).
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
# Bases existantes creees avant Flyway : baseline en V1, puis V2+ sont appliquees.
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true

# Pas de session ouverte pendant le rendu des vues : les associations necessaires
# sont chargees explicitement (@EntityGraph dans BookingRepository).
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=5
#spring.web.resources.add-mappings=false

app.seed.default-users.enabled=${SEED_DEFAULT_USERS:true}
app.seed.default-users.admin-username=${SEED_ADMIN_USERNAME:admin}
app.seed.default-users.admin-email=${SEED_ADMIN_EMAIL:admin@gmail.com}
app.seed.default-users.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.default-users.user-username=${SEED_USER_USERNAME:user}
app.seed.default-users.user-email=${SEED_USER_EMAIL:user@gmail.com}
app.seed.default-users.user-password=${SEED_USER_PASSWORD:User@123}

# Cookies de session : jamais accessibles en JS, SameSite=Lax.
# Secure est actif par defaut en prod (HTTPS) via application-prod.properties.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie-secure=${COOKIE_SECURE:false}

# Anti brute-force : verrouillage par compte + limite de requetes par IP.
app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login.lock-duration-minutes=${LOGIN_LOCK_DURATION_MINUTES:15}
app.login.rate-limit.max-requests=${LOGIN_RATE_LIMIT_MAX:20}
app.login.rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW:60}
