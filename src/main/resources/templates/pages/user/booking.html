<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{fragments/head :: head('Réserver une Salle - BookingRoom')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/fragments/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/card.css}">
    <link rel="stylesheet" th:href="@{/css/pages/booking.css}">
</head>
<body>

<a class="skip-link" href="#main-content">Aller au contenu</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" tabindex="-1">
    <section class="search-container">
        <h2>Trouver une salle</h2>
        <form class="search-form" th:action="@{/booking}" method="get" th:object="${roomsearch}">
            <div class="form-group">
                <label for="room">Nom de la salle</label>
                <input type="text" id="room" placeholder="ex: Jupiter" th:field="*{name}">
            </div>

            <div class="form-group">
                <label for="capacity">Capacité minimum</label>
                <input id="capacity" type="number" min="1" placeholder="Nombre de personnes" th:field="*{capacity}">
            </div>

            <div class="form-group">
                <label class="checkbox-item">
                    <input type="checkbox" name="projector" id="projector" value="true" th:checked="*{projector}">
                    <span>Avec projecteur</span>
                </label>


                <label class="checkbox-item">
                    <input type="checkbox" name="whiteboard" id="whiteboard" value="true" th:checked="*{whiteboard}">
                    <span>Avec tableau blanc</span>
                </label>


                <label class="checkbox-item">
                    <input type="checkbox" name="videoconferencing" id="videoconferencing" value="true" th:checked="*{videoconferencing}">
                    <span>Avec video conference</span>
                </label>
            </div>


            <button class="btn-search" type="submit">Rechercher</button>
        </form>
    </section>

    <!-- Section des résultats -->
    <section class="results-section">
        <th:block th:if="${!#lists.isEmpty(rooms)}">
            <h3>Salles disponibles</h3>
            <div class="cards-grid">
                <th:block th:each="r : ${rooms}">
                    <div th:replace="~{fragments/card :: card(${r.id}, ${r.getName()}, ${r.getCapacity()}, ${r.getLocation()})}"></div>
                </th:block>
            </div>

            <!-- Pagination : les filtres courants sont repris dans chaque lien (URL partageable). -->
            <nav class="pagination" th:if="${totalPages > 1}" aria-label="Pagination">
                <a th:if="${currentPage > 0}"
                   th:href="@{/booking(page=${currentPage - 1},
                                       name=${roomsearch.name},
                                       capacity=${roomsearch.capacity},
                                       projector=${roomsearch.projector},
                                       whiteboard=${roomsearch.whiteboard},
                                       videoconferencing=${roomsearch.videoconferencing})}"
                   class="btn-page">Précédent</a>

                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/booking(page=${i},
                                           name=${roomsearch.name},
                                           capacity=${roomsearch.capacity},
                                           projector=${roomsearch.projector},
                                           whiteboard=${roomsearch.whiteboard},
                                           videoconferencing=${roomsearch.videoconferencing})}"
                       th:text="${i + 1}"
                       th:class="${currentPage == i} ? 'btn-page active' : 'btn-page'"
                       th:attr="aria-current=${currentPage == i ? 'page' : null}"></a>
                </span>

                <a th:if="${currentPage < totalPages - 1}"
                   th:href="@{/booking(page=${currentPage + 1},
                                       name=${roomsearch.name},
                                       capacity=${roomsearch.capacity},
                                       projector=${roomsearch.projector},
                                       whiteboard=${roomsearch.whiteboard},
                                       videoconferencing=${roomsearch.videoconferencing})}"
                   class="btn-page">Suivant</a>
            </nav>
        </th:block>

        <th:block th:if="${#lists.isEmpty(rooms)}">
            <div class="empty-state">
                <div class="empty-state-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </div>
                <h3>Aucune salle ne correspond à vos critères</h3>
                <p>Essayez d'élargir votre recherche ou de retirer certains filtres.</p>
                <a th:href="@{/booking}" class="btn btn-outline">Voir toutes les salles</a>
            </div>
        </th:block>
    </section>
</main>





</body>
</html>
