<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BookingRoom</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/pages/dashboard.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="admin-section">
    <h1>Administration</h1>

    <section>
        <div class="section-header">
            <h2>Gestion des Salles</h2>
            <a th:href="@{/admin/rooms/new}" class="btn btn-primary">Ajouter une salle</a>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Localisation</th>
                    <th>Capacité</th>
                    <th>Disponibilité</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.name}">Nom</td>
                    <td th:text="${room.location}">Localisation</td>
                    <td th:text="${room.capacity}">0</td>
                    <td>
                        <div th:if="${room.available}">
                            <span class="status-badge status-available">Actif</span>
                            <div class="availability-window">
                                <span th:if="${room.availableFrom}" th:text="${'De: ' + #temporals.format(room.availableFrom, 'dd/MM HH:mm')}"></span>
                                <span th:if="${room.availableUntil}" th:text="${' À: ' + #temporals.format(room.availableUntil, 'dd/MM HH:mm')}"></span>
                            </div>
                        </div>
                        <span th:unless="${room.available}" class="status-badge status-unavailable">Maintenance</span>
                    </td>
                    <td>
                        <div class="actions-row">
                            <a th:href="@{/admin/rooms/edit/{id}(id=${room.id})}" class="btn btn-outline btn-sm">Modifier</a>
                            <form th:action="@{/admin/rooms/toggle-availability/{id}(id=${room.id})}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-secondary btn-sm" th:text="${room.available ? 'Désactiver' : 'Activer'}">Toggle</button>
                            </form>
                            <form th:action="@{/admin/rooms/delete/{id}(id=${room.id})}" method="post" class="inline-form" onsubmit="return confirm('Supprimer cette salle ?')">
                                <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    <section class="section-spaced">
        <div class="section-header">
            <h2>Réservations</h2>
            <form th:action="@{/admin}" method="get" class="filter-form">
                <input type="text" name="roomName" placeholder="Filtrer par salle..." th:value="${roomName}">
                <input type="text" name="username" placeholder="Filtrer par utilisateur..." th:value="${username}">
                <button type="submit" class="btn btn-primary">Filtrer</button>
                <a th:href="@{/admin}" class="btn btn-outline">Réinitialiser</a>
            </form>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Salle</th>
                    <th>Utilisateur</th>
                    <th>Titre</th>
                    <th>Début</th>
                    <th>Fin</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.room.name}">Salle</td>
                    <td th:text="${booking.user.firstname + ' ' + booking.user.lastname}">User</td>
                    <td th:text="${booking.title}">Titre</td>
                    <td th:text="${#temporals.format(booking.startTime, 'dd/MM/yyyy HH:mm')}">01/01/2026 12:00</td>
                    <td th:text="${#temporals.format(booking.endTime, 'dd/MM/yyyy HH:mm')}">01/01/2026 14:00</td>
                    <td>
                        <form th:action="@{/booking/cancel/{id}(id=${booking.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Annuler cette réservation ?')">Annuler</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

</body>
</html>
