<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<body>

<div class="container">
    <div class="card" th:fragment="card (id, title, capacity, location)">
        <div class="visual" th:class="${'visual room-visual--' + (id % 6)}">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 9v10.9c0 .61.49 1.1 1.1 1.1H13V4H5.1C4.49 4 4 4.49 4 5v4m10.5 6c.83 0 1.5-1.12 1.5-2.5S15.33 10 14.5 10s-1.5 1.12-1.5 2.5.67 2.5 1.5 2.5M15 3v2h4.97V21H15v2h7V3h-7z"/>
            </svg>
        </div>

        <div class="content">
            <h3 th:text="${title}">Titre par défaut</h3>
            <p>Capacité <span><th:block th:text="${capacity}"></th:block> pers.</span></p>
            <p>Localisation <span><th:block th:text="${location}"></th:block></span></p>
            
            <div class="action">
                <a th:href="@{/booking/{id}(id=${id})}" class="btn-detail">Voir détails</a>
            </div>
        </div>
    </div>
</div>

</body>
