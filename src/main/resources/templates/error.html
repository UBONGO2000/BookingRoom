<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{fragments/head :: head('Erreur - BookingRoom')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/fragments/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>

<a class="skip-link" href="#main-content">Aller au contenu</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" tabindex="-1">
    <div class="error-container">
        <div class="error-icon" aria-hidden="true">⚠️</div>
        <h1>Oups ! Quelque chose s'est mal passé</h1>
        <p th:text="${errorMessage}">Une erreur inattendue est survenue.</p>
        <a th:href="@{/}" class="btn-home">Retour à l'accueil</a>
    </div>
</main>

</body>
</html>
