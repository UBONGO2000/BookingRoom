# Profil de demonstration publique (Render, portfolio).
# Reprend la securite de la prod, mais accepte les donnees fictives de demo.
# Ne jamais utiliser ce profil pour de vraies donnees.

spring.jpa.show-sql=false
springdoc.api-docs.enabled=false
spring.flyway.clean-disabled=true

# Derriere le reverse proxy TLS de la plateforme.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie-secure=${COOKIE_SECURE:true}

# Comptes et salles de demonstration.
app.seed.default-users.enabled=${SEED_DEFAULT_USERS:true}
