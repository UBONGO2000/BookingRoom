# Active avec SPRING_PROFILES_ACTIVE=prod.
# Aucune valeur de repli ici : l'application refuse de demarrer si DB_URL,
# DB_USERNAME ou DB_PASSWORD manquent.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le schema est cree et mis a jour par Flyway au demarrage (migrations versionnees).
# ddl-auto=validate ne cree et ne modifie rien : aucune evolution automatique en prod.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.show-sql=false

# Derriere un reverse proxy TLS : les cookies Secure et HSTS reposent sur
# X-Forwarded-Proto, traite par le framework.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie-secure=${COOKIE_SECURE:true}

# Aucun compte de demonstration : DataInitializer est deja @Profile("dev"),
# ce garde-fou rend le comportement explicite meme si le profil est mal configure.
app.seed.default-users.enabled=false
