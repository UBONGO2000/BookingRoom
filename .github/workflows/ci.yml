name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Rendre le wrapper exécutable
        run: chmod +x mvnw
      - name: Build, tests et couverture
        run: ./mvnw -B --no-transfer-progress clean verify

      # Un echec de test doit etre diagnosticable depuis le log et les
      # annotations, sans avoir a ouvrir le rapport HTML.
      - name: Résumé des tests en échec
        if: failure()
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/*.txt)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::Aucun rapport surefire : l'echec est survenu avant les tests."
            exit 0
          fi
          failing=""
          for report in "${reports[@]}"; do
            if grep -qE "Failures: [1-9]|Errors: [1-9]" "$report"; then
              failing="$failing $(basename "$report" .txt)"
              echo "----- $report"
              head -n 40 "$report"
            fi
          done
          if [ -n "$failing" ]; then
            echo "::error::Tests en echec :$failing"
          else
            echo "::error::Tous les tests passent : verifier les etapes de build (compilation, JaCoCo, packaging)."
          fi

  deploy:
    name: Déploiement Render
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
    steps:
      - name: Vérifier la configuration
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL absent : déploiement ignoré."
          fi

      - name: Déclencher le déploiement
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Déclenchement du deploy hook Render..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Vérification ignorée
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.RENDER_APP_URL == ''
        run: |
          echo "::warning::RENDER_APP_URL absent : smoke test ignoré."

      - name: Attendre le commit déployé
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.RENDER_APP_URL != ''
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          BASE_URL="${RENDER_APP_URL%/}"
          echo "Attente du commit $EXPECTED_COMMIT sur $BASE_URL"
          for attempt in $(seq 1 60); do
            info=$(curl -fsS "$BASE_URL/actuator/info" || true)
            if echo "$info" | grep -q "$EXPECTED_COMMIT"; then
              echo "Déploiement confirmé : $info"
              exit 0
            fi
            echo "Tentative $attempt/60 : l'ancien conteneur répond encore, nouvelle tentative dans 15 s."
            sleep 15
          done
          echo "::error::Le commit $EXPECTED_COMMIT n'est pas en ligne après 15 minutes."
          exit 1
